[Automatic]
Enabled=1
; Seconds the cutaway stays open after the hit that opened it.
Duration=5.0
; A player projectile hit that kills a human opens the X-ray of the part it hit.
Kills=1
; A player projectile hit that cripples a limb (or the head or torso) opens that part.
Cripples=1
; A player projectile critical hit opens the part it hit.
Criticals=1
; A player projectile shot through a man's testicles or penis opens the torso X-ray. Any X-ray of such a shot,
; kill, cripple or critical too, opens only the skin over the genitals instead of the whole torso.
Groin=1
; Every player projectile hit opens the X-ray. Overrides Kills, Cripples, Criticals and Groin.
EveryHit=0
; Which parts can open.
Torso=1
Legs=1
Arms=1
; Feral ghouls (glowing ones, reavers and the rest) open too, with the human anatomy on their skeleton. Ghoul NPCs always do.
FeralGhouls=1
; Super mutants and nightkin open too, the human anatomy sized to their skeleton. Behemoths open only the head and legs,
; their skeleton has no upper spine.
SuperMutants=1
; Horses on the HAP horse skeleton (the Drivables horses) open too, with a horse skeleton of their own. A neck shot opens the
; head and neck, a shoulder or thigh shot the torso, and Legs and Arms cover the hind legs and forelegs.
Horses=1
; Blood sprays from the entry and exit wounds, and from anything the bullet bursts. BloodAmount scales how much (0 to 4).
BloodSpray=1
BloodAmount=1.5
; How much harder a killing shot hits (1 to 3): more and wider bone breaks flying faster, a wider torn channel with bigger
; lumps, more blood pumping out of the exit, and the heart and kidneys bursting whole when the bullet passes through them.
KillSeverity=1.8
; Gore sounds as the bullet goes in, breaks bone, tears organs, bursts a testicle and leaves, one random clip per moment
; from Data\Sound\fx\xraykillcam\<moment>\. Add or remove clips there. Volume 0 to 1, the killcam slows and lowers them.
Sounds=1
SoundVolume=1.0

[Cinematic]
; Starts the game's killcam on the part that opened the X-ray, with its slow motion. For kills the game's Kill Cam option decides:
; Full moves the camera, Player View only slows time, Disabled asks for nothing. Cripples, criticals and groin shots always run in Full.
; Duration is the killcam timer in seconds (0.5 to 10), about 1.1 real seconds each in Full. The X-ray stays open while it plays.
; ImpactSpeed is how fast the X-ray plays against the killcam's slow motion while the bullet crosses the part (0.05 to 1,
; 1 for the same pace); it eases back to the killcam's pace once the first breaks have flown.
Enabled=1
Duration=4.0
ImpactSpeed=0.3
; While the killcam plays on the X-ray's target, hold the camera close to the wound, behind the entry,
; turning slowly about it. Distance in game units (10 to 80), orbit in degrees a second (0 to 90).
CloseUp=1
CloseUpDistance=28
CloseUpOrbit=20

[Appearance]
; Opacity of the anatomy (0 to 1) and the head anatomy's size (0.5 to 1.5).
Opacity=1.0
Scale=1.0
; Depth allowance for the face mask, in game units (0..4). Does not expand its outline.
DepthTolerance=2.0
; Head anatomy offset along its local axes, in game units (-8 to 8).
Up=0.0
Forward=0.0
Side=0.0

[Debug]
; Saves the last 32 X-ray shots to XRayKillcamCaptures\ in the game folder for bug reports. Off by default.
ShotAudit=0
